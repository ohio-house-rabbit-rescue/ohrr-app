# Build the iPhone app and send it to TestFlight — from GitHub's macOS runners,
# so nobody needs a Mac. Free for this public repository.
#
# One-time setup (an OHRR Apple Developer account is required):
#   1. App Store Connect → Users and Access → Integrations → App Store Connect
#      API → Team keys → Generate (role: App Manager). Download the .p8 once.
#   2. App Store Connect → Apps → + → New App: iOS, name "OHRR", bundle id
#      org.ohiohouserabbitrescue.app (register it under Certificates, IDs &
#      Profiles → Identifiers first), SKU "ohrr-app".
#   3. GitHub → this repo → Settings → Secrets and variables → Actions:
#        APPLE_TEAM_ID                  the 10-character Team ID
#        APP_STORE_CONNECT_KEY_ID       from step 1
#        APP_STORE_CONNECT_ISSUER_ID    from step 1
#        APP_STORE_CONNECT_API_KEY_P8   the whole contents of the .p8 file
#   4. Actions → "iOS → TestFlight" → Run workflow. ~20 minutes later the build
#      is in App Store Connect → TestFlight; add internal testers there.
#
# Signing is automatic (Xcode cloud-managed): the API key lets xcodebuild
# create the certificate and profile itself, so no .p12 juggling.
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'What changed (shown in TestFlight "What to Test")'
        required: false
        default: 'Test build'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pick Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"

      - name: Build the web app and sync the iOS project
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: App Store Connect API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$P8" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" >> "$GITHUB_ENV"

      - name: Build number = run number
        run: |
          cd ios/App
          # CURRENT_PROJECT_VERSION must go up on every upload; the run number always does.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" App.xcodeproj/project.pbxproj

      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic

      - name: Export and upload to TestFlight
        run: |
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Done
        run: echo "Uploaded build ${{ github.run_number }} — it appears in App Store Connect → TestFlight after processing (10–30 min). Note: ${{ github.event.inputs.note }}"
