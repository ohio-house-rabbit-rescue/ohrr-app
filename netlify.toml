# Netlify build & deploy config for the OHRR / Midwest BunFest companion.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page-app fallback: let React Router handle client-side routes
# (e.g. /schedule, /give) instead of returning a 404 on direct load/refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Pre-launch: link-only. Search engines are told not to index or follow anything.
# Anyone with the URL can still open the app. Remove at app-store launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
