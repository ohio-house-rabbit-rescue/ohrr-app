<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/ohrr-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0669ac" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Your companion for Midwest BunFest — the largest rabbit festival and educational expo in the Eastern U.S., hosted by Ohio House Rabbit Rescue."
    />
    <title>Midwest BunFest · Ohio House Rabbit Rescue</title>
  </head>
  <body>
    <!-- Hidden static form so Netlify Forms detects "service-signup" at build
         time; the live React form (src/pages/ServiceSignup.tsx) posts to it. -->
    <form name="service-signup" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="service" />
      <input type="text" name="date" />
      <input type="text" name="time" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="bunny" />
      <textarea name="notes"></textarea>
    </form>

    <!-- Hidden static form so Netlify Forms detects "volunteer-signup" at build
         time; the live React form (src/pages/VolunteerSignup.tsx) posts to it. -->
    <form name="volunteer-signup" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="role" />
      <input type="text" name="code" />
      <input type="text" name="item" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="availability" />
      <textarea name="notes"></textarea>
    </form>

    <!-- Hidden static form so Netlify Forms detects "happy-tail" at build time;
         the live React form (src/pages/ShareTail.tsx) posts to it. -->
    <form name="happy-tail" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="bunny" />
      <input type="text" name="since" />
      <textarea name="story"></textarea>
      <input type="text" name="photoUrl" />
    </form>

    <!-- Hidden static form so Netlify Forms detects "surrender-intake" at build
         time; the live React form (src/pages/SurrenderForm.tsx) posts to it. -->
    <form name="surrender-intake" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="type" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="tel" name="altPhone" />
      <input type="email" name="email" />
      <input type="text" name="address" />
      <input type="text" name="cityStateZip" />
      <input type="text" name="heardAbout" />
      <input type="text" name="rabbitName" />
      <input type="text" name="reason" />
      <input type="text" name="gotFrom" />
      <input type="text" name="ownedFor" />
      <input type="text" name="age" />
      <input type="text" name="enclosure" />
      <input type="text" name="timeOut" />
      <input type="text" name="livedWith" />
      <input type="text" name="behaviorRabbits" />
      <input type="text" name="behaviorCats" />
      <input type="text" name="behaviorDogs" />
      <input type="text" name="behaviorChildren" />
      <input type="text" name="behaviorStrangers" />
      <input type="text" name="litterBox" />
      <input type="text" name="litterUse" />
      <input type="text" name="litterType" />
      <input type="text" name="diet" />
      <input type="text" name="lastVet" />
      <input type="text" name="vetName" />
      <input type="text" name="spayNeuter" />
      <input type="text" name="surgeryClinic" />
      <input type="text" name="foundConditions" />
      <input type="text" name="eating" />
      <input type="text" name="behavior" />
      <input type="text" name="litterHabits" />
      <input type="text" name="vetVisit" />
      <input type="text" name="healthConcerns" />
      <input type="text" name="otherInfo" />
      <input type="text" name="signature" />
      <input type="text" name="agreement" />
      <input type="text" name="agreementDate" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
